services:
  db:
    image: postgres:latest
    container_name: postgres-exercise
    environment:
      POSTGRES_User: "postgres"
      POSTGRES_PASSWORD: "secretcircle"
      POSTGRES_DB: "exerciseapp"
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  